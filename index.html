<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دعوة زفاف محمد & زينب</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Reem+Kufi:wght@400;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">
<section class="cover" id="cover" aria-label="الباب">
  <video class="cover__vid" id="doorVid" poster="assets/door-poster.jpg" muted playsinline preload="auto">
    <source src="assets/door.mp4" type="video/mp4">
  </video>
  <div class="cover__veil"></div><div class="cover__taps" id="tapLayer"></div>
  <div class="cover__ui" id="coverUi">
    <p class="cover__names">محمد & زينب</p>
    <p class="cover__hint">دُقّوا على الباب ثلاث دقّاتٍ ليُفتح</p>
    <div class="knocks"><span></span><span></span><span></span></div>
    <div class="cover__progress" id="progress">0 / 3</div>
  </div>
</section>
<main class="invite" id="invite">
<section class="stage" id="hero">
  <video class="stage__vid" id="heroVid" poster="assets/hero-poster.jpg" muted playsinline preload="metadata">
    <!-- ضع hero.mp4 هنا عند توفره -->
    <source src="assets/hero.mp4" type="video/mp4">
  </video>
  <div class="stage__veil"></div>
  <div class="stage__inner">
    <div class="stage__kicker">دعوة زفاف</div><div class="stage__orn">✦</div>
    <div class="couple"><span>محمد</span><span class="couple__amp">&amp;</span><span>زينب</span></div>
    <div class="stage__date">يوم الجمعة، ٢٠ تشرين الثاني ٢٠٢٦</div>
    <div class="stage__time">الساعة السابعة مساءً</div>
    <div class="stage__sub">فتحنا باب فرحتنا… وطارت البشائر تدعوكم</div>
    <div class="scroll-cue">مرحبًا بكم <em>✦</em> <em>✦</em><b>⌄</b></div>
  </div>
</section>
</main>
<script src="script.js"></script>
</body></html>
